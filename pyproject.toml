[project]
name = "tiffinpin-backend"
version = "0.1.0"
description = "Multi-vendor tiffin ordering platform backend"
requires-python = ">=3.11"
authors = [
    {name = "Piyush", email = "piyushhhagarwal@email.com"},
    {name = "Krishna", email = "krishnagupta26295@email.com"},
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "asyncpg==0.30.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.7.1",
    "black==24.10.0",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]